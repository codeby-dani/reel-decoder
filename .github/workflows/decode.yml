name: Decode an account
run-name: Decode ${{ inputs.account }} (${{ inputs.model }})

on:
  workflow_dispatch:
    inputs:
      account:
        description: "@handle, profile link, or a name to search (e.g. nate herk)"
        required: true
      model:
        description: "Which model labels the scripts"
        type: choice
        options: [gpt, jev, both]
        default: gpt
      limit:
        description: "How many recent reels"
        default: "50"

permissions:
  contents: write

concurrency:
  group: decode
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install -q uv && uv pip install --system -r pipeline/requirements.txt
      - name: Decode
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GPT_MODEL: ${{ vars.GPT_MODEL }}
          TRANSCRIBE_MODEL: ${{ vars.TRANSCRIBE_MODEL }}
          ACCOUNT: ${{ inputs.account }}
          MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
        run: python -u pipeline/decode.py --account "$ACCOUNT" --model "$MODEL" --limit "$LIMIT"
      - name: Commit results
        if: success() || failure()
        env:
          ACCOUNT: ${{ inputs.account }}
          MODEL: ${{ inputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Decode $ACCOUNT ($MODEL)"
          git pull --rebase
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reel Decoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#111418; --muted:#5E6573; --line:#D9DDE3; --accent:#1F4FD8;
  --h1:#1F4FD8; --h2:#D0512B; --h3:#0E8A6A; --h4:#9A3FC4; --h5:#B98A00; --h6:#C2417A; --h7:#0F8FB5; --h8:#8A919C; --good:#0E7A5E; --bad:#C0442A;
  --s-hook:#1F4FD8; --s-setup:#8A93A3; --s-payoff:#0E8A6A; --s-pitch:#D0512B;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1215; --surface:#171B20; --ink:#E8EBEF; --muted:#97A0AD; --line:#2A3038; --accent:#7C9BFF;
  --h1:#7C9BFF; --h2:#FF8A5C; --h3:#3CCB9F; --h4:#C98AF0; --h5:#E3BA3A; --h6:#F07BAE; --h7:#4FC3E6; --h8:#7D8695; --good:#3CCB9F; --bad:#FF8A5C;
  --s-hook:#7C9BFF; --s-setup:#7D8695; --s-payoff:#3CCB9F; --s-pitch:#FF8A5C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1215; --surface:#171B20; --ink:#E8EBEF; --muted:#97A0AD; --line:#2A3038; --accent:#7C9BFF;
  --h1:#7C9BFF; --h2:#FF8A5C; --h3:#3CCB9F; --h4:#C98AF0; --h5:#E3BA3A; --h6:#F07BAE; --h7:#4FC3E6; --h8:#7D8695; --good:#3CCB9F; --bad:#FF8A5C;
  --s-hook:#7C9BFF; --s-setup:#7D8695; --s-payoff:#3CCB9F; --s-pitch:#FF8A5C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,58px);font-weight:800;font-stretch:72%;letter-spacing:-.01em;line-height:1}
h1 span{color:var(--accent)}
h2{font-size:22px;font-weight:700;font-stretch:80%}
.eyebrow,.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);margin:8px 0 0;max-width:70ch}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.note{color:var(--muted);font-size:13px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--display);font-stretch:75%;font-size:32px;font-weight:700;line-height:1.1}
.kpi small{color:var(--muted);font-size:12.5px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* chart */
.chart-box{overflow-x:auto}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.dot{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
.dot:hover,.dot.sel{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip:focus-visible,.cell:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tables */
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.tbl-box{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:4px;background:var(--line);position:relative;min-width:90px}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
.mult{font-family:var(--mono);font-size:12.5px}
.up{color:var(--good)} .down{color:var(--bad)}
.best{color:var(--muted);font-size:12.5px;max-width:34ch}
/* archive + detail */
.archive{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.cell{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--line);padding:0}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .tag{position:absolute;left:0;right:0;bottom:0;height:4px}
.cell .pl{position:absolute;left:4px;top:4px;font:500 10px var(--mono);background:rgba(0,0,0,.62);color:#fff;border-radius:3px;padding:1px 4px}
.cell.sel{border-color:var(--ink)}
.cell.dim{opacity:.22}
.detail{display:flex;flex-direction:column;gap:14px}
.d-top{display:grid;grid-template-columns:96px 1fr;gap:14px}
.d-top img{width:96px;aspect-ratio:9/16;object-fit:cover;border-radius:6px;max-width:100%}
.labels{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-content:start}
.labels div{border-bottom:2px solid var(--line);padding-bottom:4px}
.labels b{display:block;font-weight:600;font-size:14.5px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
.script{display:flex;flex-direction:column;gap:6px;max-width:65ch}
.seg{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px}
.seg em{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;font-style:normal;padding-top:3px}
.seg p{margin:0;padding-left:10px;border-left:3px solid}
.seg-legend{display:flex;gap:12px;flex-wrap:wrap;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
a{color:var(--accent)}
.findings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.findings{grid-template-columns:1fr}}
.finding h3{font:700 17px var(--display);font-stretch:85%;margin:4px 0 6px}
.finding p{margin:0;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:12.5px;max-width:90ch}
@media (prefers-reduced-motion:no-preference){.dot{transition:r .15s}}
</style>
</head>
<body>
<style>
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search input{width:100%;font:500 15px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sugg{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 14px var(--body);padding:9px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--bg);outline:none}
.sugg small{color:var(--muted);font:12px var(--mono)}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-ctl button{font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.05em;border:0;background:none;color:var(--muted);padding:9px 14px;cursor:pointer}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-ctl button:disabled{opacity:.35;cursor:not-allowed}
.seg-ctl button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.new{margin-left:auto;font:600 14px var(--body);color:var(--accent);background:none;cursor:pointer;border:1px solid var(--accent);border-radius:8px;padding:8px 12px}
.new[aria-expanded="true"]{background:var(--accent);color:var(--surface)}
.decoder{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:900px){.decoder{grid-template-columns:1fr}}
.decoder input{font:500 15px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.decoder input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > *{flex:1 1 auto}
.btn{font:600 14px var(--body);border:0;border-radius:8px;padding:10px 16px;background:var(--ink);color:var(--surface);cursor:pointer;flex:0 0 auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.users{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.user{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:6px 10px;cursor:pointer;font:14px var(--body)}
.user[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.user img,.user .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line)}
.user small{color:var(--muted);font:12px var(--mono)}
.field{display:flex;flex-direction:column;gap:4px}
.msg{font-size:14px;min-height:1.5em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.runs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.run{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.pill{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Reel decoder · every script labelled, every hook scored</div>
    <h1>Decode <span id="handle">@…</span></h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="toolbar" aria-label="Choose account and model">
    <div class="search">
      <label class="lbl" for="q" style="display:block;margin-bottom:4px">Account</label>
      <input id="q" type="search" autocomplete="off" placeholder="Search decoded accounts">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div>
      <span class="lbl" style="display:block;margin-bottom:4px">Labelled by</span>
      <div class="seg-ctl" id="models" role="group" aria-label="Model"></div>
    </div>
    <button class="new" id="new" type="button" aria-expanded="false" aria-controls="decoder">+ Decode a new account</button>
  </nav>

  <section class="panel decoder" id="decoder" hidden>
    <div>
      <h2 style="margin-bottom:10px">Find an account</h2>
      <form class="row" id="igform">
        <div class="field" style="flex:1 1 220px"><label class="lbl" for="igq">Name or handle</label><input id="igq" placeholder="e.g. nate herk"></div>
        <button class="btn" id="igbtn" type="submit">Search Instagram</button>
      </form>
      <div class="users" id="users"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2>Run the decode</h2>
      <div class="field"><span class="lbl">Account</span><b id="pick" style="font-size:16px">Pick one from the search</b></div>
      <div class="row">
        <div class="field"><span class="lbl">Label with</span><div class="seg-ctl" id="dmodel" role="group" aria-label="Model to label with">
          <button type="button" id="dm-gpt" data-m="gpt" aria-pressed="true">GPT</button><button type="button" id="dm-jev" data-m="jev" aria-pressed="false">Jev</button><button type="button" id="dm-both" data-m="both" aria-pressed="false">Both</button></div></div>
        <div class="field" style="flex:0 1 110px"><label class="lbl" for="dlimit">Reels</label><input id="dlimit" type="number" min="5" max="200" value="50"></div>
      </div>
      <div class="field"><label class="lbl" for="pass">Passcode</label><input id="pass" type="password" autocomplete="current-password" placeholder="Your DECODE_PASSCODE"></div>
      <div><button class="btn" id="go" type="button" disabled>Decode</button></div>
      <p class="msg" id="dmsg" role="status"></p>
      <div><span class="lbl">Recent runs</span><div class="runs" id="runs"><span class="note">Loading…</span></div></div>
    </div>
  </section>

  <div id="app">
    <div class="wrap" style="padding:0">
      <section class="kpis" id="kpis"></section>
      <section class="panel findings" id="findings"></section>
      <section class="panel">
        <div class="panel-head"><h2>Every reel, by plays</h2><div class="legend" id="legend"></div></div>
        <div class="chart-box"><svg id="chart" role="img" aria-label="Plays per reel over posting date, coloured by hook type"></svg></div>
        <p class="note" id="chart-note"></p>
      </section>
      <section class="grid2">
        <div class="panel">
          <div class="panel-head"><h2>Which hooks work</h2><span class="lbl">median plays · vs account median</span></div>
          <div class="tbl-box"><table id="hooks"></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Topics</h2><span class="lbl">reels · median plays</span></div>
          <div class="tbl-box"><table id="topics"></table></div>
        </div>
      </section>
      <section class="grid2">
        <div class="panel">
          <div class="panel-head"><h2>Reel archive</h2><span class="lbl" id="arch-count"></span></div>
          <div class="archive" id="archive"></div>
        </div>
        <div class="panel detail" id="detail"></div>
      </section>
    </div>
  </div>
  <footer id="foot"></footer>
</div>

<script>
const HOOKS = ["Capability unlock","Breaking news","Hot take","Personal experiment","Money angle","Someone built","How-to / explainer","Other"];
const HC = {}; HOOKS.forEach((h,i)=>HC[h]=`var(--h${i+1})`);
const MODELS = {gpt:"GPT", jev:"Jev", claude:"Claude"};
const fmt = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+"M" : n>=1e3 ? (n/1e3).toFixed(n>=1e5?0:1)+"K" : String(Math.round(n));
const med = a => { const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length ? (s.length%2 ? s[m] : (s[m-1]+s[m])/2) : 0; };
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dfmt = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const cls = m => m>=1.15 ? "up" : m<=0.85 ? "down" : "";
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };

// Link to the Actions form of this repo (owner.github.io/repo/)


let INDEX = [], ACC = null, MODEL = null, REELS = [], live = [], base = 0, byHook = [], filter = null, selected = null;

async function boot(){
  try { INDEX = (await (await fetch("data/index.json",{cache:"no-store"})).json()).accounts || []; } catch { INDEX = []; }
  if(!INDEX.length){ $("app").innerHTML = `<div class="panel empty">No accounts decoded yet. Use “Decode a new account” to run the first one.</div>`; return; }
  const want = (location.hash.slice(1) || store.get("acc") || "").toLowerCase();
  await openAccount(INDEX.find(a=>a.handle===want) || INDEX[0]);
}

async function openAccount(acc, model){
  ACC = acc;
  const pref = model || store.get("model");
  MODEL = acc.models.includes(pref) ? pref : acc.models[0];
  store.set("acc", acc.handle); store.set("model", MODEL);
  history.replaceState(null, "", "#"+acc.handle.replace(/[^A-Za-z0-9._~-]/g,""));
  renderModels();
  const d = await (await fetch(`data/${acc.handle}/${MODEL}.json`,{cache:"no-store"})).json();
  REELS = d.reels.filter(r=>r.plays>0);
  live = REELS.filter(r=>!r.pinned); if(!live.length) live = REELS;
  base = med(live.map(r=>r.plays));
  byHook = HOOKS.map(h=>{ const rs=live.filter(r=>r.hook===h); return {h, rs, med:med(rs.map(r=>r.plays)), cpk:med(rs.map(r=>r.comments/r.plays*1000))}; }).filter(x=>x.rs.length);
  filter = null; selected = [...live].sort((a,b)=>b.plays-a.plays)[0]?.shortCode;
  $("handle").textContent = "@"+acc.handle;
  $("q").value = "";
  const dates = live.map(r=>new Date(r.timestamp)).sort((a,b)=>a-b);
  $("sub").textContent = `${d.full_name} · ${REELS.length} recent reels, labelled by ${MODELS[MODEL]} (${d.model_id||MODEL}). Posted ${dfmt(dates[0])} – ${dfmt(dates.at(-1))}. Scraped ${d.generated.slice(0,10)}.`;
  document.title = `Decode @${acc.handle}`;
  renderKpis(dates); renderFindings(); renderAll(); renderHooks(); renderTopics(); renderDetail();
  $("foot").innerHTML = `Plays are Instagram's public count at scrape time, so the newest reels are still climbing. ${live.length} reels is a small sample: treat gaps under ~1.3× as noise, and rows marked “small sample” as anecdotes.`;
}

function renderModels(){
  $("models").innerHTML = ["gpt","jev", ...(ACC.models.includes("claude")?["claude"]:[])].map(m=>
    `<button id="m-${m}" aria-pressed="${m===MODEL}" ${ACC.models.includes(m)?"":"disabled title=\"Not decoded with this model yet\""} data-m="${m}">${MODELS[m]}</button>`).join("");
  $("models").querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>openAccount(ACC,b.dataset.m));
}

// account search
function renderSugg(){
  const q = $("q").value.trim().toLowerCase().replace(/^@/,"");
  const hits = INDEX.filter(a=>!q || a.handle.includes(q) || (a.full_name||"").toLowerCase().includes(q)).slice(0,8);
  $("sugg").innerHTML = hits.length ? hits.map(a=>`<button data-h="${esc(a.handle)}"><span>@${esc(a.handle)} <span style="color:var(--muted)">${esc(a.full_name||"")}</span></span><small>${a.models.map(m=>MODELS[m]).join(" · ")}</small></button>`).join("")
    : `<button id="sugg-ig" data-q="${esc(q)}"><span>Search Instagram for “${esc(q)}”</span><small>decode it</small></button>`;
  $("sugg").hidden = false;
  $("sugg").querySelectorAll("button[data-h]").forEach(b=>b.onclick=()=>{ $("sugg").hidden=true; openAccount(INDEX.find(a=>a.handle===b.dataset.h)); });
  const ig=$("sugg-ig"); if(ig) ig.onclick=()=>{ $("sugg").hidden=true; openDecoder(ig.dataset.q); };
}
$("q").addEventListener("input", renderSugg);
$("q").addEventListener("focus", renderSugg);
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const b=$("sugg").querySelector("button"); if(b) b.click(); } if(e.key==="Escape") $("sugg").hidden=true; });
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) $("sugg").hidden=true; });

function renderKpis(dates){
  const bestHook = byHook.filter(x=>x.rs.length>=3).sort((a,b)=>b.med-a.med)[0];
  const weeks = Math.max(1, (dates.at(-1)-dates[0])/864e5/7);
  $("kpis").innerHTML = [
    [fmt(base), "median plays", "non-pinned reels"],
    [(live.length/weeks).toFixed(1), "reels per week", `${live.length} reels over ${Math.round(weeks)} weeks`],
    [bestHook ? bestHook.h : "–", "strongest hook", bestHook ? `${(bestHook.med/base).toFixed(1)}× median, ${bestHook.rs.length} reels` : "no hook with 3+ reels"],
    [med(live.map(r=>r.comments/r.plays*1000)).toFixed(0), "comments per 1K plays", "median across reels"],
  ].map(([b,l,s])=>`<div class="kpi"><span class="lbl">${l}</span><b class="num">${esc(b)}</b><small>${esc(s)}</small></div>`).join("");
}

// Findings are computed, so they work for any account.
function groupBy(key){ const g={}; live.forEach(r=>(g[r[key]]??=[]).push(r)); return Object.entries(g).map(([k,rs])=>({k,rs,m:med(rs.map(r=>r.plays))})); }
function renderFindings(){
  const f = [];
  const topics = groupBy("topic").filter(x=>x.rs.length>=3).sort((a,b)=>b.m-a.m);
  if(topics.length){ const t=topics[0], top4=[...live].sort((a,b)=>b.plays-a.plays).slice(0,4).filter(r=>r.topic===t.k).length;
    f.push({k:"Best topic", t:t.k, p:`${t.rs.length} reels at ${(t.m/base).toFixed(1)}× the account median${top4?`, and ${top4} of the top 4 reels`:""}.`}); }
  const used = [...byHook].sort((a,b)=>b.rs.length-a.rs.length)[0];
  if(used){ const m=used.med/base; f.push({k:"Most-used hook", t:used.h, p:`Used on ${used.rs.length} of ${live.length} reels and lands at ${m.toFixed(2)}× median. ${m<0.9?"The default opener underperforms.":m>1.1?"The default opener is also a winner.":"About average."}`}); }
  const asks = groupBy("cta").filter(x=>x.rs.length>=3).sort((a,b)=>b.m-a.m);
  if(asks.length>1){ const a=asks[0], z=asks.at(-1); f.push({k:"Best ask", t:a.k, p:`Reels offering “${a.k}” reach ${(a.m/base).toFixed(1)}× median; “${z.k}” reaches ${(z.m/base).toFixed(1)}×.`}); }
  $("findings").innerHTML = f.map(x=>`<div class="finding"><span class="lbl">${esc(x.k)}</span><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p></div>`).join("");
  $("findings").hidden = !f.length;
}

function renderLegend(){
  $("legend").innerHTML = byHook.map(x=>`<button class="chip" aria-pressed="${filter===x.h}" data-h="${esc(x.h)}"><i style="background:${HC[x.h]}"></i>${esc(x.h)} <span class="num" style="color:var(--muted)">${x.rs.length}</span></button>`).join("");
  $("legend").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ filter = filter===b.dataset.h ? null : b.dataset.h; renderAll(); });
}

function renderChart(){
  const W=1100,H=340,m={l:52,r:16,t:14,b:30};
  const ts = live.map(r=>+new Date(r.timestamp));
  const t0=Math.min(...ts)-864e5, t1=Math.max(...ts)+864e5;
  const ymin=Math.max(100, 10**Math.floor(Math.log10(Math.min(...live.map(r=>r.plays))))), ymax=Math.max(...live.map(r=>r.plays))*1.3;
  const x=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r);
  const y=v=>m.t+(1-(Math.log10(Math.max(v,ymin))-Math.log10(ymin))/(Math.log10(ymax)-Math.log10(ymin)))*(H-m.t-m.b);
  let s="";
  for(let e=Math.log10(ymin); 10**e<ymax; e++) [1,3].forEach(k=>{ const v=k*10**e; if(v>=ymin&&v<ymax) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`; });
  const step = Math.max(7, Math.ceil((t1-t0)/864e5/8));
  for(let t=t0+864e5; t<t1; t+=step*864e5) s+=`<text x="${x(t)}" y="${H-10}" text-anchor="middle">${dfmt(new Date(t))}</text>`;
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${W-m.r}" y="${y(base)-6}" text-anchor="end">median ${fmt(base)}</text>`;
  live.forEach(r=>{ const on=!filter||r.hook===filter, sel=selected===r.shortCode;
    s+=`<circle class="dot${sel?' sel':''}" tabindex="0" data-c="${r.shortCode}" cx="${x(+new Date(r.timestamp)).toFixed(1)}" cy="${y(r.plays).toFixed(1)}" r="${sel?8:6}" fill="${HC[r.hook]||'var(--h8)'}" opacity="${on?0.92:0.12}"><title>${esc(r.hook_line)} · ${fmt(r.plays)} plays</title></circle>`; });
  const svg=$("chart"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.style.minWidth="640px"; svg.style.width="100%"; svg.innerHTML=s;
  svg.querySelectorAll(".dot").forEach(d=>{ d.onclick=()=>select(d.dataset.c); d.onkeydown=e=>{ if(e.key==="Enter") select(d.dataset.c); }; });
  const pinned=REELS.filter(r=>r.pinned);
  $("chart-note").textContent = "Log scale." + (pinned.length && live!==REELS ? ` Not shown: ${pinned.length} pinned reels (${pinned.map(r=>fmt(r.plays)).join(", ")} plays), which have had months to accumulate.` : "");
}

function renderHooks(){
  const max=Math.max(...byHook.map(x=>x.med));
  $("hooks").innerHTML = `<tr><th>Hook</th><th class="r">Reels</th><th>Median plays</th><th class="r">vs median</th><th class="r">Cmts/1K</th></tr>` +
    [...byHook].sort((a,b)=>b.med-a.med).map(x=>{ const top=[...x.rs].sort((a,b)=>b.plays-a.plays)[0], mult=x.med/base, small=x.rs.length<3;
      return `<tr style="${small?'opacity:.55':''}"><td><b>${esc(x.h)}</b>${small?' <span class="lbl">small sample</span>':''}<div class="best">Top: “${esc(top.hook_line)}” · ${fmt(top.plays)}</div></td>
      <td class="r num">${x.rs.length}</td>
      <td><div class="num" style="font-size:13px">${fmt(x.med)}</div><div class="bar"><span style="width:${x.med/max*100}%;background:${HC[x.h]}"></span></div></td>
      <td class="r mult ${cls(mult)}">${mult.toFixed(2)}×</td><td class="r num">${x.cpk.toFixed(0)}</td></tr>`; }).join("");
}
function renderTopics(){
  const tops=groupBy("topic").sort((a,b)=>b.m-a.m), max=Math.max(...tops.map(x=>x.m));
  $("topics").innerHTML = `<tr><th>Topic</th><th class="r">Reels</th><th>Median plays</th></tr>` + tops.map(x=>`<tr style="${x.rs.length<3?'opacity:.55':''}"><td>${esc(x.k)}</td><td class="r num">${x.rs.length}</td><td><div class="num" style="font-size:13px">${fmt(x.m)}</div><div class="bar"><span style="width:${x.m/max*100}%;background:var(--accent)"></span></div></td></tr>`).join("");
}

function renderArchive(){
  const rs=[...REELS].sort((a,b)=>b.plays-a.plays);
  $("arch-count").textContent = `${REELS.length} reels · sorted by plays`;
  $("archive").innerHTML = rs.map(r=>`<button class="cell${selected===r.shortCode?' sel':''}${filter&&r.hook!==filter?' dim':''}" data-c="${r.shortCode}" aria-label="${esc(r.hook_line)}"><img src="${esc(r.thumb)}" alt="" loading="lazy"><span class="pl">${fmt(r.plays)}</span><span class="tag" style="background:${HC[r.hook]||'var(--h8)'}"></span></button>`).join("");
  $("archive").querySelectorAll(".cell").forEach(c=>c.onclick=()=>select(c.dataset.c));
}

const SEGC={hook:"var(--s-hook)",setup:"var(--s-setup)",payoff:"var(--s-payoff)",pitch:"var(--s-pitch)"};
function renderDetail(){
  const r=REELS.find(x=>x.shortCode===selected); if(!r){ $("detail").innerHTML=""; return; }
  const mult=r.plays/base;
  $("detail").innerHTML = `
    <div class="panel-head" style="margin:0"><h2>Inside the reel</h2><span class="lbl">${new Date(r.timestamp).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}${r.pinned?" · pinned":""}</span></div>
    <div class="d-top"><img src="${esc(r.thumb)}" alt="">
      <div class="labels">
        <div style="border-color:${HC[r.hook]||'var(--h8)'}"><span class="lbl">Hook${r.confidence!=null?` · ${Math.round(r.confidence*100)}% sure`:""}</span><b>${esc(r.hook)}</b></div>
        <div><span class="lbl">Topic</span><b>${esc(r.topic)}</b></div>
        <div><span class="lbl">Format</span><b>${esc(r.format)}</b></div>
        <div><span class="lbl">Ask</span><b>${esc(r.cta)}</b></div>
      </div></div>
    <div class="stats"><span><b>${fmt(r.plays)}</b> plays</span><span><b>${fmt(r.likes)}</b> likes</span><span><b>${fmt(r.comments)}</b> comments</span><span><b class="${cls(mult)}">${mult.toFixed(1)}×</b> median</span><span><b>${Math.round(r.duration)}s</b></span></div>
    <div class="seg-legend">${Object.entries(SEGC).map(([k,c])=>`<span style="color:${c}">■ ${k}</span>`).join("")}</div>
    <div class="script">${r.segs.length ? r.segs.map(([t,s])=>`<div class="seg"><em style="color:${SEGC[t]}">${t}</em><p style="border-color:${SEGC[t]}">${esc(s)}</p></div>`).join("") : '<p class="note">No speech in this reel.</p>'}</div>
    <a href="https://www.instagram.com/reel/${r.shortCode}/" target="_blank" rel="noopener">Open on Instagram ↗</a>`;
}

function select(code){ selected=code; renderChart(); renderArchive(); renderDetail(); if(innerWidth<900) $("detail").scrollIntoView({behavior:"smooth",block:"start"}); }
function renderAll(){ renderLegend(); renderChart(); renderArchive(); }
// ---------- decoding new accounts (Vercel API routes) ----------
let pick = null, dmodel = "gpt", pollTimer = null;
$("pass").value = store.get("pass") || "";
async function api(path, body, auth){
  const headers = {"x-passcode": $("pass").value.trim()};
  const r = await fetch("api/"+path, body ? {method:"POST", headers:{...headers, "Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store", headers: auth ? headers : {}});
  const j = await r.json().catch(()=>({error: r.status===504 ? "The server timed out. Try again." : `Server returned ${r.status}.`}));
  if(!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}
function say(text, kind){ $("dmsg").textContent = text; $("dmsg").className = "msg" + (kind ? " "+kind : ""); }
function openDecoder(q){
  $("decoder").hidden = false; $("new").setAttribute("aria-expanded","true");
  if(q){ $("igq").value = q; $("igform").requestSubmit(); } else $("igq").focus();
  loadRuns(); clearInterval(pollTimer); pollTimer = setInterval(loadRuns, 15000);
}
$("new").onclick = ()=>{ if($("decoder").hidden) openDecoder(); else { $("decoder").hidden = true; $("new").setAttribute("aria-expanded","false"); clearInterval(pollTimer); } };
$("pass").addEventListener("change", ()=>store.set("pass", $("pass").value.trim()));
$("dmodel").querySelectorAll("button").forEach(b=>b.onclick=()=>{ dmodel=b.dataset.m; $("dmodel").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); });

function showUsers(users, q, pending){
  $("users").innerHTML = users.map(u=>`<button type="button" class="user" data-u="${esc(u.username)}" aria-pressed="${pick===u.username}">
    ${u.pic ? `<img src="${esc(u.pic)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'}
    <span><b>@${esc(u.username)}</b>${u.verified?" ✓":""}${u.private?' <span class="lbl">private</span>':""}<br><span style="color:var(--muted)">${esc(u.fullName)}</span></span>
    <small>${u.followers!=null ? fmt(u.followers)+" followers" : ""}${INDEX.some(a=>a.handle===u.username) ? " · decoded" : ""}</small></button>`).join("")
    + (pending ? '<p class="note">Looking for more matches…</p>' : "");
  $("users").querySelectorAll(".user").forEach(b=>b.onclick=()=>{
    pick = b.dataset.u; $("pick").textContent = "@"+pick; $("go").disabled = false;
    $("users").querySelectorAll(".user").forEach(x=>x.setAttribute("aria-pressed", x===b));
  });
}

$("igform").addEventListener("submit", async e=>{
  e.preventDefault();
  const q = $("igq").value.trim(); if(!q) return;
  if(!$("pass").value.trim()){ say("Enter the passcode first. Searching costs Apify credit.", "err"); $("pass").focus(); return; }
  store.set("pass", $("pass").value.trim());
  $("igbtn").disabled = true; $("users").innerHTML = "";
  const handleLike = q.replace(/^@/,"").toLowerCase();
  const exact = /^[a-z0-9._]{1,30}$/.test(handleLike) ? [{username:handleLike, fullName:"Use this exact handle", followers:null, verified:false, pic:"", exact:true}] : [];
  showUsers(exact, q, true);
  const t0 = Date.now(), tick = setInterval(()=>say(`Searching Instagram… ${Math.round((Date.now()-t0)/1000)}s (usually about a minute)`), 1000);
  try {
    const { runId } = await api("search", { q });
    let res;
    while(true){
      await new Promise(r=>setTimeout(r, 3000));
      res = await api(`search?run=${encodeURIComponent(runId)}&q=${encodeURIComponent(q)}`, null, true);
      if(res.status === "done") break;
      if(Date.now()-t0 > 180000) throw new Error("Search took over 3 minutes. Try again, or type the exact @handle.");
    }
    clearInterval(tick);
    const found = res.users.filter(u=>u.username!==handleLike || !exact.length);
    if(exact.length){ const hit = res.users.find(u=>u.username===handleLike); if(hit) exact[0] = {...hit, exact:true}; }
    showUsers([...exact, ...found], q, false);
    say(exact.length+found.length ? "Pick the right account, then press Decode." : `No accounts found for “${q}”.`);
  } catch(err){ clearInterval(tick); say(err.message, "err"); }
  $("igbtn").disabled = false;
});

$("go").onclick = async ()=>{
  if(!pick) return;
  store.set("pass", $("pass").value.trim());
  $("go").disabled = true;
  try {
    const r = await api("decode", { handle: pick, model: dmodel, limit: $("dlimit").value });
    say(`Started decoding @${r.handle} with ${MODELS[r.model]||"GPT + Jev"} (${r.limit} reels). About 10–15 minutes; this list updates by itself.`, "ok");
    setTimeout(loadRuns, 4000);
  } catch(err){ say(err.message, "err"); }
  $("go").disabled = false;
};

async function loadRuns(){
  try {
    const { runs } = await api("runs");
    $("runs").innerHTML = runs.length ? runs.map(w=>{
      const st = w.status!=="completed" ? ["running","var(--accent)"] : w.conclusion==="success" ? ["done","var(--good)"] : [w.conclusion||"failed","var(--bad)"];
      return `<div class="run"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a><span class="pill" style="color:${st[1]}">${esc(st[0])}</span></div>`; }).join("")
      : '<span class="note">No runs yet.</span>';
    const latest = runs[0];
    if(latest && latest.status==="completed" && latest.conclusion==="success" && Date.now()-new Date(latest.updated) < 5*60e3)
      $("runs").insertAdjacentHTML("beforeend", `<p class="note">The latest run finished. Vercel redeploys in about a minute, then <button class="btn" type="button" onclick="location.reload()" style="padding:4px 10px">reload</button></p>`);
  } catch(err){ $("runs").innerHTML = `<span class="note">${esc(err.message)}</span>`; }
}

boot();
</script>
</body></html>
